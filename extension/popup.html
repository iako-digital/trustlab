<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TrustLab</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>🛡 TrustLab</h1>
    <section id="check" hidden></section>
    <label class="row">
      <input type="checkbox" id="enabled" />
      <span>Show badges on Facebook and Telegram</span>
    </label>
    <label for="baseUrl">TrustLab site address</label>
    <input id="baseUrl" type="url" placeholder="https://your-trustlab-site.example" />
    <div class="actions">
      <button id="save">Save</button>
      <button id="refresh" class="secondary">Refresh claims</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="popup.js"></script>
  </body>
</html>
