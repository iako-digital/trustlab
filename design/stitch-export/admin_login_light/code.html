<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TrustLab Admin Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=Inter:wght@400;500;600&amp;family=Noto+Serif:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#004269",
                        "surface-dim": "#dbdad6",
                        "on-surface": "#1b1c1a",
                        "on-secondary-fixed-variant": "#3c475b",
                        "secondary-fixed-dim": "#bbc7df",
                        "surface-bright": "#faf9f5",
                        "on-tertiary-fixed-variant": "#693c00",
                        "on-tertiary-container": "#ffbe7d",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#95ccff",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#d7e3fc",
                        "on-secondary-fixed": "#101c2e",
                        "surface-container-low": "#f5f4f0",
                        "outline": "#717880",
                        "tertiary": "#5d3500",
                        "inverse-primary": "#95ccff",
                        "tertiary-fixed-dim": "#ffb86f",
                        "background": "#faf9f5",
                        "on-background": "#1b1c1a",
                        "on-tertiary-fixed": "#2c1600",
                        "primary-container": "#0e5a8a",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#576378",
                        "on-surface-variant": "#41474f",
                        "surface-container-high": "#e9e8e4",
                        "tertiary-fixed": "#ffdcbd",
                        "on-primary-container": "#a0d0ff",
                        "inverse-surface": "#30312e",
                        "surface-container": "#efeeea",
                        "inverse-on-surface": "#f2f1ed",
                        "surface-variant": "#e3e2df",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#7e4900",
                        "secondary": "#535f74",
                        "on-error": "#ffffff",
                        "surface-tint": "#1e6393",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e3e2df",
                        "on-primary-fixed-variant": "#004a75",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#001d32",
                        "outline-variant": "#c1c7d0",
                        "surface": "#faf9f5",
                        "primary-fixed": "#cde5ff",
                        "secondary-container": "#d4e0f9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "margin-desktop": "40px",
                        "container-max": "1200px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "label-caps": ["IBM Plex Mono"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Noto Serif"],
                        "meta-sm": ["IBM Plex Mono"],
                        "display-lg": ["Noto Serif"],
                        "headline-sm": ["Noto Serif"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "meta-sm": ["11px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-sm": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .input-error {
            border-color: #ba1a1a !important;
            box-shadow: 0 0 0 2px rgba(186, 26, 26, 0.2) !important;
        }
        .btn-hover-effect:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(14, 90, 138, 0.15);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md antialiased p-margin-mobile">
<!-- Main Container -->
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-lg shadow-[0_2px_4px_rgba(15,27,45,0.04),0_8px_16px_rgba(15,27,45,0.08)] p-8 md:p-10 border border-surface-variant flex flex-col gap-8">
<!-- Header -->
<header class="flex flex-col items-center text-center gap-4">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 0;">lock</span>
</div>
<div>
<h1 class="font-headline-sm text-headline-sm text-on-surface mb-2">Admin Portal</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to access the Evidence Desk.</p>
</div>
</header>
<!-- Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full pl-12 pr-4 py-3 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="email" placeholder="Enter your email" readonly="" required="" type="email" value="admin@trustlab.org"/>
</div>
</div>
<!-- Password Input (Error State) -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-error" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-error" style="font-variation-settings: 'FILL' 0;">key</span>
<input class="w-full pl-12 pr-12 py-3 rounded-full border input-error bg-surface-container-lowest text-on-surface font-body-md focus:outline-none transition-all" id="password" placeholder="Enter your password" required="" type="password" value="••••••••"/>
<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-error hover:text-on-error-container transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
<div class="flex items-center gap-1.5 mt-1">
<span class="material-symbols-outlined text-[16px] text-error" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-meta-sm text-meta-sm text-error">Incorrect password. Please try again.</p>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 mt-2">
<button class="w-full bg-primary-container text-on-primary-container font-label-caps text-label-caps py-3.5 rounded-full btn-hover-effect transition-all flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<div class="text-center">
<a class="font-meta-sm text-meta-sm text-primary hover:underline transition-all" href="#">Forgot your password?</a>
</div>
</div>
</form>
<!-- Footer -->
<footer class="pt-6 border-t border-surface-variant text-center">
<p class="font-meta-sm text-meta-sm text-on-surface-variant flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 0;">verified_user</span>
                Secure connection established
            </p>
</footer>
</main>
</body></html>
